<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto AR.js - Realidade Aumentada</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: white;
      font-size: 18px;
      margin-top: 20px;
      font-weight: 500;
    }

    #instructions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      max-width: 90%;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    #controls {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 15px;
      border-radius: 10px;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .control-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: transform 0.2s;
    }

    .control-btn:hover {
      transform: scale(1.05);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    input[type="file"] {
      margin: 10px 0;
      padding: 5px;
      font-size: 12px;
    }

    .info-text {
      font-size: 12px;
      margin-top: 10px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <!-- Tela de Carregamento -->
  <div id="loading-screen">
    <div class="loader"></div>
    <div class="loading-text">Carregando AR Experience...</div>
  </div>

  <!-- Instruções -->
  <div id="instructions">
    📱 Aponte a câmera para o marcador Hiro<br>
    👆 Clique no objeto 3D para mudar a cor
  </div>

  <!-- Controles -->
  <div id="controls">
    <div style="margin-bottom: 10px; font-weight: bold;">⚙️ Controles</div>
    <button class="control-btn" onclick="changeAnimation()">🔄 Animação</button>
    <button class="control-btn" onclick="changeColor()">🎨 Cor</button>
    <button class="control-btn" onclick="resetModel()">↺ Resetar</button>
    <div class="info-text">
      📦 Carregue seu modelo 3D (.glb/.gltf):
    </div>
    <input type="file" id="model-upload" accept=".glb,.gltf" onchange="loadCustomModel(event)">
  </div>

  <!-- Cena AR -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium; antialias: true; colorManagement: true; sortObjects: true;"
    loading-screen="enabled: false"
    gesture-detector>

    <!-- Assets -->
    <a-assets>
      <a-asset-item id="default-model" src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Duck/glTF-Binary/Duck.glb"></a-asset-item>
    </a-assets>

    <!-- Marcador Hiro -->
    <a-marker preset="hiro" id="main-marker">
      <!-- Plano base -->
      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="2"
        height="2"
        color="#4CC3D9"
        opacity="0.3"
        material="side: double">
      </a-plane>

      <!-- Modelo 3D Principal -->
      <a-entity
        id="ar-model"
        gltf-model="#default-model"
        position="0 0.5 0"
        rotation="0 0 0"
        scale="0.3 0.3 0.3"
        animation__rotate="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
        animation__float="property: position; to: 0 0.7 0; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine"
        class="clickable">
      </a-entity>

      <!-- Iluminação -->
      <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>
      <a-light type="directional" position="1 2 1" intensity="0.8" color="#ffffff"></a-light>
      <a-light type="point" position="0 2 0" intensity="0.5" color="#FFA500"></a-light>

      <!-- Partículas decorativas -->
      <a-entity id="particles" position="0 0 0">
        <a-sphere position="0.5 1 0.5" radius="0.05" color="#FF6B6B" opacity="0.6"
          animation="property: position; to: 0.5 1.5 0.5; dir: alternate; loop: true; dur: 1500"></a-sphere>
        <a-sphere position="-0.5 1 0.5" radius="0.05" color="#4ECDC4" opacity="0.6"
          animation="property: position; to: -0.5 1.5 0.5; dir: alternate; loop: true; dur: 1800"></a-sphere>
        <a-sphere position="0 1 -0.5" radius="0.05" color="#FFE66D" opacity="0.6"
          animation="property: position; to: 0 1.5 -0.5; dir: alternate; loop: true; dur: 2000"></a-sphere>
      </a-entity>

      <!-- Anel giratório -->
      <a-torus
        position="0 0.5 0"
        radius="0.8"
        radius-tubular="0.02"
        color="#9D4EDD"
        opacity="0.4"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
      </a-torus>
    </a-marker>

    <!-- Câmera AR -->
    <a-entity camera look-controls="enabled: false"></a-entity>
  </a-scene>

  <script>
    // Variáveis globais
    let animationActive = true;
    let currentColor = 0;
    const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE'];
    let customModelUrl = null;

    // Gesture Detector para mobile
    AFRAME.registerComponent('gesture-detector', {
      schema: {
        enabled: { default: true }
      },
      init: function() {
        this.handleTouchStart = this.handleTouchStart.bind(this);
        this.handleTouchEnd = this.handleTouchEnd.bind(this);
        this.el.addEventListener('touchstart', this.handleTouchStart);
        this.el.addEventListener('touchend', this.handleTouchEnd);
      },
      handleTouchStart: function(e) {
        this.startY = e.touches[0].clientY;
      },
      handleTouchEnd: function(e) {
        const endY = e.changedTouches[0].clientY;
        if (Math.abs(endY - this.startY) < 10) {
          this.el.emit('tap');
        }
      }
    });

    // Remover tela de carregamento após inicialização
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading-screen').classList.add('hidden');
      }, 2000);
    });

    // Sistema de clique no modelo - ATUALIZADO para funcionar em mobile
    AFRAME.registerComponent('clickable', {
      init: function () {
        this.handleClick = this.handleClick.bind(this);
        this.el.addEventListener('click', this.handleClick);
        this.el.sceneEl.addEventListener('tap', this.handleClick);
      },
      handleClick: function() {
        changeColor();
        triggerPulseEffect(this.el);
      }
    });

    // Alternar animação
    function changeAnimation() {
      const model = document.getElementById('ar-model');
      animationActive = !animationActive;
      
      if (animationActive) {
        model.setAttribute('animation__rotate', {
          property: 'rotation',
          to: '0 360 0',
          loop: true,
          dur: 8000,
          easing: 'linear'
        });
        model.setAttribute('animation__float', {
          property: 'position',
          to: '0 0.7 0',
          dir: 'alternate',
          loop: true,
          dur: 2000,
          easing: 'easeInOutSine'
        });
      } else {
        model.removeAttribute('animation__rotate');
        model.removeAttribute('animation__float');
      }
    }

    // Mudar cor
    function changeColor() {
      const model = document.getElementById('ar-model');
      currentColor = (currentColor + 1) % colors.length;
      
      model.setAttribute('material', {
        color: colors[currentColor],
        shader: 'standard',
        metalness: 0.5,
        roughness: 0.3
      });
    }

    // Resetar modelo
    function resetModel() {
      const model = document.getElementById('ar-model');
      model.setAttribute('position', '0 0.5 0');
      model.setAttribute('rotation', '0 0 0');
      model.setAttribute('scale', '0.3 0.3 0.3');
      model.removeAttribute('material');
      
      if (customModelUrl) {
        model.setAttribute('gltf-model', customModelUrl);
      } else {
        model.setAttribute('gltf-model', '#default-model');
      }
      
      animationActive = true;
      changeAnimation();
    }

    // Efeito de pulso ao clicar
    function triggerPulseEffect(el) {
      const currentScale = el.getAttribute('scale');
      el.setAttribute('animation__pulse', {
        property: 'scale',
        to: `${currentScale.x * 1.2} ${currentScale.y * 1.2} ${currentScale.z * 1.2}`,
        dur: 200,
        dir: 'alternate',
        loop: 1
      });
    }

    // Carregar modelo 3D customizado
    function loadCustomModel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        customModelUrl = e.target.result;
        const model = document.getElementById('ar-model');
        model.setAttribute('gltf-model', customModelUrl);
        
        // Resetar escala para novo modelo
        model.setAttribute('scale', '0.5 0.5 0.5');
        
        alert('✅ Modelo carregado com sucesso! Aponte para o marcador Hiro.');
      };
      reader.readAsDataURL(file);
    }

    // Log de debug - MELHORADO
    const marker = document.getElementById('main-marker');
    
    marker.addEventListener('markerFound', () => {
      console.log('✅ Marcador detectado!');
      document.getElementById('instructions').innerHTML = '✅ Marcador detectado!<br>👆 Toque no objeto 3D';
      document.getElementById('instructions').style.background = 'rgba(0,200,0,0.8)';
    });

    marker.addEventListener('markerLost', () => {
      console.log('❌ Marcador perdido!');
      document.getElementById('instructions').innerHTML = '📱 Aponte a câmera para o marcador Hiro<br>👆 Toque no objeto 3D';
      document.getElementById('instructions').style.background = 'rgba(0,0,0,0.8)';
    });

    // Verificar permissões de câmera
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(function(stream) {
        console.log('✅ Câmera acessada com sucesso');
        stream.getTracks().forEach(track => track.stop());
      })
      .catch(function(err) {
        console.error('❌ Erro ao acessar câmera:', err);
        alert('⚠️ Erro: Não foi possível acessar a câmera. Verifique as permissões do navegador.');
      });
  </script>
</body>
</html>
