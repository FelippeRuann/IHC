<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Simples - Funciona!</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #info {
      position: fixed;
      top: 10px;
      width: 100%;
      text-align: center;
      z-index: 1000;
      color: white;
      font-size: 14px;
    }

    .info-box {
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 5px;
      display: inline-block;
      margin: 5px;
    }

    .detected {
      background: rgba(0,200,0,0.8) !important;
    }

    #controls {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 1000;
    }

    button {
      background: rgba(100,100,255,0.9);
      color: white;
      border: none;
      padding: 12px 24px;
      margin: 5px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:active {
      background: rgba(50,50,200,0.9);
    }

    #upload-container {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      padding: 15px;
      border-radius: 8px;
      z-index: 1000;
      max-width: 90%;
    }

    input[type="file"] {
      color: white;
      font-size: 12px;
    }

    .marker-link {
      color: #4CAF50;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Informações -->
  <div id="info">
    <div class="info-box" id="status">📱 Procurando marcador...</div>
    <div class="info-box">
      📥 Marcador: <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" 
         target="_blank" class="marker-link">Baixe aqui</a>
    </div>
  </div>

  <!-- Upload de modelo -->
  <div id="upload-container">
    <label style="color: white; display: block; margin-bottom: 5px; font-size: 14px;">
      📦 Carregar modelo 3D (.glb):
    </label>
    <input type="file" id="model-input" accept=".glb" onchange="loadModel(event)">
  </div>

  <!-- Controles -->
  <div id="controls">
    <button onclick="changeColor()">🎨 Mudar Cor</button>
    <button onclick="toggleAnimation()">⏯️ Animar</button>
    <button onclick="resetAll()">🔄 Resetar</button>
  </div>

  <!-- Cena AR -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <!-- Assets -->
    <a-assets>
      <a-asset-item 
        id="model" 
        src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Duck/glTF-Binary/Duck.glb">
      </a-asset-item>
    </a-assets>

    <!-- Marcador Hiro -->
    <a-marker preset="hiro" id="marker">
      
      <!-- Plano base -->
      <a-plane 
        position="0 0 0" 
        rotation="-90 0 0" 
        width="1.5" 
        height="1.5" 
        color="#4CAF50" 
        opacity="0.5">
      </a-plane>

      <!-- Modelo 3D -->
      <a-entity
        id="model-entity"
        gltf-model="#model"
        position="0 0.5 0"
        scale="0.5 0.5 0.5"
        rotation="0 0 0">
      </a-entity>

      <!-- Caixa simples (backup se modelo não carregar) -->
      <a-box 
        id="backup-box"
        position="0 1 0" 
        rotation="0 45 0" 
        color="#FF6B6B"
        scale="0.5 0.5 0.5"
        visible="false">
      </a-box>

    </a-marker>

    <!-- Câmera -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Variáveis globais
    let animating = true;
    let currentColor = 0;
    const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#FFD93D', '#A8E6CF'];
    let rotationSpeed = 0;

    // Detectar marcador
    const marker = document.querySelector('#marker');
    const statusBox = document.querySelector('#status');

    marker.addEventListener('markerFound', () => {
      console.log('✅ Marcador detectado!');
      statusBox.textContent = '✅ Marcador detectado!';
      statusBox.classList.add('detected');
      startAnimation();
    });

    marker.addEventListener('markerLost', () => {
      console.log('❌ Marcador perdido');
      statusBox.textContent = '📱 Procurando marcador...';
      statusBox.classList.remove('detected');
    });

    // Sistema de animação
    function startAnimation() {
      const modelEntity = document.querySelector('#model-entity');
      if (!modelEntity) return;

      if (animating) {
        modelEntity.setAttribute('animation', {
          property: 'rotation',
          to: '0 360 0',
          loop: true,
          dur: 5000,
          easing: 'linear'
        });
      }
    }

    // Alternar animação
    function toggleAnimation() {
      animating = !animating;
      const modelEntity = document.querySelector('#model-entity');
      
      if (animating) {
        modelEntity.setAttribute('animation', {
          property: 'rotation',
          to: '0 360 0',
          loop: true,
          dur: 5000,
          easing: 'linear'
        });
      } else {
        modelEntity.removeAttribute('animation');
      }
    }

    // Mudar cor
    function changeColor() {
      currentColor = (currentColor + 1) % colors.length;
      const modelEntity = document.querySelector('#model-entity');
      const backupBox = document.querySelector('#backup-box');
      
      // Tenta aplicar cor no modelo
      modelEntity.setAttribute('material', {
        color: colors[currentColor]
      });
      
      // Aplica na caixa backup também
      backupBox.setAttribute('color', colors[currentColor]);
      
      console.log('🎨 Cor mudada para:', colors[currentColor]);
    }

    // Resetar
    function resetAll() {
      const modelEntity = document.querySelector('#model-entity');
      modelEntity.setAttribute('position', '0 0.5 0');
      modelEntity.setAttribute('rotation', '0 0 0');
      modelEntity.setAttribute('scale', '0.5 0.5 0.5');
      modelEntity.removeAttribute('material');
      currentColor = 0;
      animating = true;
      startAnimation();
      console.log('🔄 Resetado!');
    }

    // Carregar modelo customizado
    function loadModel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const modelEntity = document.querySelector('#model-entity');
        const assets = document.querySelector('a-assets');
        
        // Remove modelo antigo
        const oldModel = document.querySelector('#model');
        if (oldModel) oldModel.remove();
        
        // Cria novo asset
        const newAsset = document.createElement('a-asset-item');
        newAsset.id = 'model';
        newAsset.src = e.target.result;
        assets.appendChild(newAsset);
        
        // Atualiza entidade
        modelEntity.setAttribute('gltf-model', '#model');
        modelEntity.setAttribute('scale', '0.3 0.3 0.3');
        
        alert('✅ Modelo carregado! Aponte para o marcador Hiro');
        console.log('📦 Novo modelo carregado');
      };
      reader.readAsDataURL(file);
    }

    // Verificar se o modelo carregou
    document.querySelector('#model-entity').addEventListener('model-loaded', () => {
      console.log('✅ Modelo 3D carregado com sucesso!');
    });

    document.querySelector('#model-entity').addEventListener('model-error', () => {
      console.log('❌ Erro ao carregar modelo, mostrando caixa backup');
      document.querySelector('#backup-box').setAttribute('visible', true);
    });
    //testando de novo
    // Log inicial
    console.log('🚀 AR.js iniciado');
    console.log('📱 Abra em HTTPS');
    console.log('📥 Baixe o marcador Hiro');
    console.log('🎯 Aponte a câmera para o marcador');
  </script>
</body>
</html>
