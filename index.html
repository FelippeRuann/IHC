<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Universal - Mobile & Desktop</title>
  
  <!-- Bibliotecas AR.js + A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Container principal */
    #ui-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }

    /* Status da câmera */
    #camera-status {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      backdrop-filter: blur(10px);
      pointer-events: auto;
      transition: all 0.3s;
      max-width: 90%;
      text-align: center;
    }

    #camera-status.detected {
      background: rgba(0,200,0,0.85);
      transform: translateX(-50%) scale(1.05);
    }

    /* Instruções */
    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      font-size: 13px;
      backdrop-filter: blur(10px);
      max-width: 90%;
      line-height: 1.6;
    }

    #instructions strong {
      color: #4CAF50;
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    #instructions a {
      color: #64B5F6;
      text-decoration: none;
      font-weight: bold;
    }

    /* Painel de controles */
    #controls-panel {
      position: absolute;
      top: 70px;
      right: 15px;
      background: rgba(0,0,0,0.85);
      padding: 15px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      pointer-events: auto;
      max-width: 280px;
    }

    #controls-panel h3 {
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group {
      margin-bottom: 15px;
    }

    .control-group label {
      color: #B0B0B0;
      font-size: 12px;
      display: block;
      margin-bottom: 8px;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-bottom: 8px;
      pointer-events: auto;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102,126,234,0.4);
    }

    button:active {
      transform: translateY(0);
    }

    input[type="file"] {
      color: white;
      font-size: 12px;
      background: rgba(255,255,255,0.1);
      padding: 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
      width: 100%;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      background: rgba(102,126,234,0.8);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
    }

    .info-text {
      color: #888;
      font-size: 11px;
      margin-top: 10px;
      line-height: 1.4;
    }

    /* Loading */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: white;
      margin-top: 20px;
      font-size: 16px;
      font-weight: 500;
    }

    /* Responsivo */
    @media (max-width: 768px) {
      #controls-panel {
        right: 10px;
        max-width: 200px;
        padding: 12px;
      }

      button {
        font-size: 12px;
        padding: 8px 14px;
      }

      #instructions {
        font-size: 12px;
        padding: 12px 15px;
      }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Carregando AR...</div>
  </div>

  <!-- Interface -->
  <div id="ui-container">
    <!-- Status -->
    <div id="camera-status">📷 Câmera inicializada - Procurando marcador...</div>

    <!-- Instruções -->
    <div id="instructions">
      <strong>📋 COMO USAR:</strong>
      1. <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank">Baixe o marcador Hiro aqui</a><br>
      2. Imprima OU abra em outra tela<br>
      3. Aponte a câmera (20-40cm)<br>
      4. Aguarde 2-3 segundos<br>
      💡 Ambiente bem iluminado funciona melhor!
    </div>

    <!-- Controles -->
    <div id="controls-panel">
      <h3>⚙️ Controles</h3>
      
      <div class="control-group">
        <button onclick="changeColor()">🎨 Mudar Cor</button>
        <button onclick="toggleAnimation()">⏯️ Animar/Pausar</button>
        <button onclick="resetModel()">🔄 Resetar</button>
      </div>

      <div class="control-group">
        <label>📦 Carregar modelo 3D (.glb):</label>
        <input type="file" id="model-file" accept=".glb" onchange="loadCustomModel(event)">
      </div>

      <div class="info-text">
        ⚡ Funciona em desktop (webcam) e mobile!
      </div>
    </div>
  </div>

  <!-- Cena AR -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <!-- Assets -->
    <a-assets>
      <a-asset-item 
        id="duck-model" 
        src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Duck/glTF-Binary/Duck.glb">
      </a-asset-item>
    </a-assets>

    <!-- Marcador Hiro -->
    <a-marker 
      preset="hiro" 
      id="hiro-marker"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;">

      <!-- Plano base -->
      <a-plane 
        position="0 0 0" 
        rotation="-90 0 0" 
        width="1.8" 
        height="1.8" 
        color="#2196F3" 
        opacity="0.4"
        material="side: double">
      </a-plane>

      <!-- Modelo 3D Principal -->
      <a-entity
        id="main-model"
        gltf-model="#duck-model"
        position="0 0.8 0"
        scale="0.4 0.4 0.4"
        rotation="0 0 0"
        class="clickable"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
      </a-entity>

      <!-- Elementos decorativos -->
      <a-torus
        position="0 0.5 0"
        radius="0.6"
        radius-tubular="0.015"
        color="#9C27B0"
        opacity="0.5"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000">
      </a-torus>

      <!-- Partículas -->
      <a-sphere 
        position="0.4 1.2 0" 
        radius="0.04" 
        color="#FF5722" 
        opacity="0.7"
        animation="property: position; to: 0.4 1.5 0; dir: alternate; loop: true; dur: 1500">
      </a-sphere>
      
      <a-sphere 
        position="-0.4 1.2 0" 
        radius="0.04" 
        color="#4CAF50" 
        opacity="0.7"
        animation="property: position; to: -0.4 1.5 0; dir: alternate; loop: true; dur: 1700">
      </a-sphere>

      <!-- Iluminação -->
      <a-light type="ambient" intensity="0.6"></a-light>
      <a-light type="directional" position="2 3 1" intensity="0.7"></a-light>

    </a-marker>

    <!-- Câmera -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ==========================================
    // VARIÁVEIS GLOBAIS
    // ==========================================
    let isAnimating = true;
    let currentColorIndex = 0;
    const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#FFD93D', '#BB8FCE', '#F06292'];

    // ==========================================
    // INICIALIZAÇÃO
    // ==========================================
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading').classList.add('hidden');
      }, 2000);

      // Verificar se webcam está disponível
      checkWebcam();
    });

    // ==========================================
    // DETECTAR MARCADOR
    // ==========================================
    const marker = document.querySelector('#hiro-marker');
    const statusDiv = document.querySelector('#camera-status');

    marker.addEventListener('markerFound', () => {
      console.log('✅ MARCADOR DETECTADO!');
      statusDiv.textContent = '✅ Marcador detectado! Objeto visível';
      statusDiv.classList.add('detected');
    });

    marker.addEventListener('markerLost', () => {
      console.log('❌ Marcador perdido');
      statusDiv.textContent = '📷 Procurando marcador...';
      statusDiv.classList.remove('detected');
    });

    // ==========================================
    // FUNÇÕES DE CONTROLE
    // ==========================================

    // Mudar cor do modelo
    function changeColor() {
      currentColorIndex = (currentColorIndex + 1) % colors.length;
      const model = document.querySelector('#main-model');
      
      model.setAttribute('material', {
        color: colors[currentColorIndex],
        shader: 'standard',
        metalness: 0.4,
        roughness: 0.5
      });

      console.log('🎨 Cor alterada para:', colors[currentColorIndex]);
    }

    // Alternar animação
    function toggleAnimation() {
      isAnimating = !isAnimating;
      const model = document.querySelector('#main-model');
      
      if (isAnimating) {
        model.setAttribute('animation', {
          property: 'rotation',
          to: '0 360 0',
          loop: true,
          dur: 6000,
          easing: 'linear'
        });
        console.log('▶️ Animação ativada');
      } else {
        model.removeAttribute('animation');
        console.log('⏸️ Animação pausada');
      }
    }

    // Resetar modelo
    function resetModel() {
      const model = document.querySelector('#main-model');
      model.setAttribute('gltf-model', '#duck-model');
      model.setAttribute('position', '0 0.8 0');
      model.setAttribute('scale', '0.4 0.4 0.4');
      model.setAttribute('rotation', '0 0 0');
      model.removeAttribute('material');
      
      currentColorIndex = 0;
      isAnimating = true;
      toggleAnimation(); // Reativa animação
      
      console.log('🔄 Modelo resetado');
      alert('✅ Modelo resetado!');
    }

    // Carregar modelo customizado
    function loadCustomModel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const model = document.querySelector('#main-model');
        const assets = document.querySelector('a-assets');
        
        // Remove asset antigo se existir
        const oldCustomAsset = document.querySelector('#custom-model');
        if (oldCustomAsset) oldCustomAsset.remove();
        
        // Cria novo asset
        const newAsset = document.createElement('a-asset-item');
        newAsset.id = 'custom-model';
        newAsset.src = e.target.result;
        assets.appendChild(newAsset);
        
        // Aguarda carregar e aplica no modelo
        setTimeout(() => {
          model.setAttribute('gltf-model', '#custom-model');
          model.setAttribute('scale', '0.3 0.3 0.3');
          console.log('📦 Modelo customizado carregado');
        }, 100);
        
        alert('✅ Modelo carregado! Aponte para o marcador Hiro');
      };
      
      reader.readAsDataURL(file);
    }

    // ==========================================
    // VERIFICAR WEBCAM
    // ==========================================
    function checkWebcam() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true })
          .then(stream => {
            console.log('✅ Webcam acessada com sucesso');
            statusDiv.textContent = '✅ Câmera OK - Mostre o marcador Hiro';
            // Para o stream para não travar a câmera
            stream.getTracks().forEach(track => track.stop());
          })
          .catch(err => {
            console.error('❌ Erro ao acessar webcam:', err);
            statusDiv.textContent = '❌ Erro ao acessar câmera - Verifique permissões';
            statusDiv.style.background = 'rgba(200,0,0,0.85)';
            
            alert('⚠️ ERRO: Não foi possível acessar a câmera.\n\nVerifique:\n1. Permissão de câmera no navegador\n2. Site está em HTTPS\n3. Câmera não está em uso por outro app');
          });
      } else {
        alert('❌ Seu navegador não suporta acesso à câmera.');
      }
    }

    // ==========================================
    // EVENTOS DO MODELO
    // ==========================================
    const modelEntity = document.querySelector('#main-model');
    
    modelEntity.addEventListener('model-loaded', () => {
      console.log('✅ Modelo 3D carregado com sucesso');
    });

    modelEntity.addEventListener('model-error', (e) => {
      console.error('❌ Erro ao carregar modelo:', e);
      alert('❌ Erro ao carregar modelo 3D. Tente outro arquivo.');
    });

    // ==========================================
    // INTERAÇÃO POR CLIQUE (Desktop)
    // ==========================================
    marker.addEventListener('click', () => {
      changeColor();
      console.log('👆 Clique detectado no marcador');
    });

    // ==========================================
    // LOGS DE DEBUG
    // ==========================================
    console.log('═══════════════════════════════════════');
    console.log('🚀 AR.js + A-Frame Iniciado');
    console.log('📱 Compatível com Mobile & Desktop');
    console.log('📥 Baixe o marcador Hiro para começar');
    console.log('═══════════════════════════════════════');
  </script>
</body>
</html>
