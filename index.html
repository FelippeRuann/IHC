<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR.js - Desktop & Mobile</title>
  
  <!-- Bibliotecas AR.js + A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    /* Tela de seleção inicial */
    #mode-selector {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: opacity 0.5s;
    }

    #mode-selector.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .mode-title {
      color: white;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }

    .mode-subtitle {
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      margin-bottom: 40px;
      text-align: center;
      max-width: 500px;
      padding: 0 20px;
    }

    .mode-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 20px;
    }

    .mode-btn {
      background: white;
      color: #667eea;
      border: none;
      padding: 20px 40px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      min-width: 200px;
    }

    .mode-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .mode-btn:active {
      transform: translateY(-2px);
    }

    .mode-btn .icon {
      font-size: 40px;
      display: block;
      margin-bottom: 10px;
    }

    .mode-btn .text {
      display: block;
      font-size: 16px;
      font-weight: 600;
    }

    .mode-btn .desc {
      display: block;
      font-size: 12px;
      color: #999;
      margin-top: 5px;
      font-weight: normal;
    }

    /* QR Code para mobile */
    #qr-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #qr-container.active {
      display: flex;
    }

    #qr-container h2 {
      color: white;
      margin-bottom: 20px;
      font-size: 24px;
    }

    #qr-code {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    #mobile-url {
      color: white;
      background: rgba(255,255,255,0.1);
      padding: 15px 25px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      word-break: break-all;
      max-width: 80%;
      text-align: center;
    }

    .close-btn {
      background: #f44336;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Interface AR */
    #ar-interface {
      display: none;
    }

    #ar-interface.active {
      display: block;
    }

    #camera-status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      backdrop-filter: blur(10px);
      z-index: 1000;
      transition: all 0.3s;
      max-width: 90%;
      text-align: center;
    }

    #camera-status.detected {
      background: rgba(0,200,0,0.85);
    }

    #instructions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      font-size: 13px;
      backdrop-filter: blur(10px);
      max-width: 90%;
      line-height: 1.6;
      z-index: 1000;
    }

    #instructions strong {
      color: #4CAF50;
      display: block;
      margin-bottom: 8px;
    }

    #instructions a {
      color: #64B5F6;
      text-decoration: none;
      font-weight: bold;
    }

    #controls-panel {
      position: fixed;
      top: 70px;
      right: 15px;
      background: rgba(0,0,0,0.85);
      padding: 15px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      z-index: 1000;
      max-width: 280px;
    }

    #controls-panel h3 {
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .control-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-bottom: 8px;
    }

    .control-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102,126,234,0.4);
    }

    #back-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      background: rgba(244,67,54,0.9);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
    }

    input[type="file"] {
      color: white;
      font-size: 12px;
      background: rgba(255,255,255,0.1);
      padding: 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
      width: 100%;
      margin-top: 8px;
    }

    @media (max-width: 768px) {
      .mode-title {
        font-size: 24px;
      }
      
      .mode-btn {
        min-width: 150px;
        padding: 15px 30px;
      }

      #controls-panel {
        max-width: 200px;
      }
    }
  </style>
</head>
<body>
  <!-- Seletor de Modo -->
  <div id="mode-selector">
    <div class="mode-title">🎯 Escolha o Modo AR</div>
    <div class="mode-subtitle">
      Selecione como você deseja usar a Realidade Aumentada
    </div>
    
    <div class="mode-buttons">
      <button class="mode-btn" onclick="startDesktopMode()">
        <span class="icon">💻</span>
        <span class="text">Modo Desktop</span>
        <span class="desc">Usar webcam do notebook</span>
      </button>
      
      <button class="mode-btn" onclick="showMobileLink()">
        <span class="icon">📱</span>
        <span class="text">Vincular Celular</span>
        <span class="desc">Gerar QR Code para mobile</span>
      </button>
    </div>
  </div>

  <!-- QR Code para Mobile -->
  <div id="qr-container">
    <h2>📱 Escaneie o QR Code no celular</h2>
    <div id="qr-code"></div>
    <div id="mobile-url"></div>
    <button class="close-btn" onclick="closeMobileLink()">✕ Fechar</button>
  </div>

  <!-- Interface AR -->
  <div id="ar-interface">
    <button id="back-btn" onclick="backToMenu()">← Voltar</button>
    
    <div id="camera-status">📷 Inicializando câmera...</div>

    <div id="instructions">
      <strong>📋 INSTRUÇÕES:</strong>
      1. <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank">Baixe o marcador Hiro</a><br>
      2. Imprima ou abra em outra tela<br>
      3. Aponte a câmera (20-40cm)<br>
      4. Aguarde detecção (2-3 seg)
    </div>

    <div id="controls-panel">
      <h3>⚙️ Controles</h3>
      <button class="control-btn" onclick="changeColor()">🎨 Mudar Cor</button>
      <button class="control-btn" onclick="toggleAnimation()">⏯️ Animar/Pausar</button>
      <button class="control-btn" onclick="resetModel()">🔄 Resetar</button>
      <label style="color: #B0B0B0; font-size: 12px; display: block; margin-top: 15px; margin-bottom: 5px;">
        📦 Carregar modelo .glb:
      </label>
      <input type="file" accept=".glb" onchange="loadCustomModel(event)">
    </div>
  </div>

  <!-- Cena AR -->
  <a-scene
    id="ar-scene"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    style="display: none;">

    <a-assets>
      <a-asset-item 
        id="duck-model" 
        src="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Duck/glTF-Binary/Duck.glb">
      </a-asset-item>
    </a-assets>

    <a-marker preset="hiro" id="hiro-marker">
      
      <a-plane 
        position="0 0 0" 
        rotation="-90 0 0" 
        width="1.8" 
        height="1.8" 
        color="#2196F3" 
        opacity="0.4">
      </a-plane>

      <a-entity
        id="main-model"
        gltf-model="#duck-model"
        position="0 0.8 0"
        scale="0.4 0.4 0.4"
        rotation="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
      </a-entity>

      <a-torus
        position="0 0.5 0"
        radius="0.6"
        radius-tubular="0.015"
        color="#9C27B0"
        opacity="0.5"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000">
      </a-torus>

      <a-sphere 
        position="0.4 1.2 0" 
        radius="0.04" 
        color="#FF5722" 
        opacity="0.7"
        animation="property: position; to: 0.4 1.5 0; dir: alternate; loop: true; dur: 1500">
      </a-sphere>
      
      <a-sphere 
        position="-0.4 1.2 0" 
        radius="0.04" 
        color="#4CAF50" 
        opacity="0.7"
        animation="property: position; to: -0.4 1.5 0; dir: alternate; loop: true; dur: 1700">
      </a-sphere>

      <a-light type="ambient" intensity="0.6"></a-light>
      <a-light type="directional" position="2 3 1" intensity="0.7"></a-light>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    // ==========================================
    // VARIÁVEIS GLOBAIS
    // ==========================================
    let isAnimating = true;
    let currentColorIndex = 0;
    const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#FFD93D', '#BB8FCE'];
    let currentMode = null;

    // ==========================================
    // DETECÇÃO AUTOMÁTICA DE DISPOSITIVO
    // ==========================================
    function isMobileDevice() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    // Se for mobile, pula direto para o AR
    window.addEventListener('load', () => {
      if (isMobileDevice()) {
        console.log('📱 Dispositivo mobile detectado - iniciando modo mobile');
        startDesktopMode(); // No mobile, funciona diretamente
      }
    });

    // ==========================================
    // MODO DESKTOP (WEBCAM)
    // ==========================================
    function startDesktopMode() {
      console.log('💻 Iniciando modo Desktop');
      currentMode = 'desktop';
      
      // Esconde seletor
      document.getElementById('mode-selector').classList.add('hidden');
      
      // Mostra interface AR
      document.getElementById('ar-interface').classList.add('active');
      document.getElementById('ar-scene').style.display = 'block';
      
      // Inicializa câmera
      initCamera();
    }

    // ==========================================
    // VINCULAR CELULAR (QR CODE)
    // ==========================================
    function showMobileLink() {
      console.log('📱 Gerando link para celular');
      
      const currentUrl = window.location.href;
      const qrContainer = document.getElementById('qr-container');
      const qrCodeDiv = document.getElementById('qr-code');
      const urlDiv = document.getElementById('mobile-url');
      
      // Limpa QR anterior
      qrCodeDiv.innerHTML = '';
      
      // Gera novo QR Code
      new QRCode(qrCodeDiv, {
        text: currentUrl,
        width: 256,
        height: 256,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
      
      // Mostra URL
      urlDiv.textContent = currentUrl;
      
      // Exibe modal
      qrContainer.classList.add('active');
    }

    function closeMobileLink() {
      document.getElementById('qr-container').classList.remove('active');
    }

    // ==========================================
    // VOLTAR AO MENU
    // ==========================================
    function backToMenu() {
      // Para a câmera
      const scene = document.querySelector('a-scene');
      if (scene && scene.components && scene.components.arjs) {
        // Para o streaming de vídeo
        const video = scene.querySelector('video');
        if (video && video.srcObject) {
          video.srcObject.getTracks().forEach(track => track.stop());
        }
      }
      
      // Esconde interface AR
      document.getElementById('ar-interface').classList.remove('active');
      document.getElementById('ar-scene').style.display = 'none';
      
      // Mostra seletor novamente
      document.getElementById('mode-selector').classList.remove('hidden');
      
      currentMode = null;
      console.log('← Voltou ao menu');
    }

    // ==========================================
    // INICIALIZAR CÂMERA
    // ==========================================
    function initCamera() {
      const statusDiv = document.getElementById('camera-status');
      
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          console.log('✅ Câmera acessada');
          statusDiv.textContent = '✅ Câmera OK - Mostre o marcador Hiro';
          // Para o stream de teste
          stream.getTracks().forEach(track => track.stop());
        })
        .catch(err => {
          console.error('❌ Erro ao acessar câmera:', err);
          statusDiv.textContent = '❌ Erro ao acessar câmera';
          statusDiv.style.background = 'rgba(200,0,0,0.85)';
          alert('⚠️ Não foi possível acessar a câmera.\nVerifique as permissões do navegador.');
        });
    }

    // ==========================================
    // DETECTAR MARCADOR
    // ==========================================
    const marker = document.querySelector('#hiro-marker');
    
    if (marker) {
      marker.addEventListener('markerFound', () => {
        console.log('✅ MARCADOR DETECTADO!');
        const statusDiv = document.getElementById('camera-status');
        statusDiv.textContent = '✅ Marcador detectado!';
        statusDiv.classList.add('detected');
      });

      marker.addEventListener('markerLost', () => {
        console.log('❌ Marcador perdido');
        const statusDiv = document.getElementById('camera-status');
        statusDiv.textContent = '📷 Procurando marcador...';
        statusDiv.classList.remove('detected');
      });
    }

    // ==========================================
    // CONTROLES
    // ==========================================
    function changeColor() {
      currentColorIndex = (currentColorIndex + 1) % colors.length;
      const model = document.querySelector('#main-model');
      
      model.setAttribute('material', {
        color: colors[currentColorIndex],
        shader: 'standard',
        metalness: 0.4,
        roughness: 0.5
      });

      console.log('🎨 Cor alterada:', colors[currentColorIndex]);
    }

    function toggleAnimation() {
      isAnimating = !isAnimating;
      const model = document.querySelector('#main-model');
      
      if (isAnimating) {
        model.setAttribute('animation', {
          property: 'rotation',
          to: '0 360 0',
          loop: true,
          dur: 6000,
          easing: 'linear'
        });
        console.log('▶️ Animação ativada');
      } else {
        model.removeAttribute('animation');
        console.log('⏸️ Animação pausada');
      }
    }

    function resetModel() {
      const model = document.querySelector('#main-model');
      model.setAttribute('gltf-model', '#duck-model');
      model.setAttribute('position', '0 0.8 0');
      model.setAttribute('scale', '0.4 0.4 0.4');
      model.setAttribute('rotation', '0 0 0');
      model.removeAttribute('material');
      
      currentColorIndex = 0;
      isAnimating = true;
      toggleAnimation();
      
      console.log('🔄 Resetado');
      alert('✅ Modelo resetado!');
    }

    function loadCustomModel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const model = document.querySelector('#main-model');
        const assets = document.querySelector('a-assets');
        
        const oldAsset = document.querySelector('#custom-model');
        if (oldAsset) oldAsset.remove();
        
        const newAsset = document.createElement('a-asset-item');
        newAsset.id = 'custom-model';
        newAsset.src = e.target.result;
        assets.appendChild(newAsset);
        
        setTimeout(() => {
          model.setAttribute('gltf-model', '#custom-model');
          model.setAttribute('scale', '0.3 0.3 0.3');
          console.log('📦 Modelo customizado carregado');
        }, 100);
        
        alert('✅ Modelo carregado!');
      };
      
      reader.readAsDataURL(file);
    }

    // ==========================================
    // LOGS
    // ==========================================
    console.log('═══════════════════════════════════');
    console.log('🚀 AR.js Iniciado');
    console.log('💻 Modo Desktop: Webcam do notebook');
    console.log('📱 Modo Mobile: Link/QR Code');
    console.log('═══════════════════════════════════');
  </script>
</body>
</html>
